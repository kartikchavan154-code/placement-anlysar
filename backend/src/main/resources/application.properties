# Application Main Configuration
spring.application.name=campus-placement-assistant
server.port=${PORT:8080}

# Spring Profiles: default uses h2 for instant local development/sandbox, easily switched to mysql
spring.profiles.default=h2

# Spring Data REST Configuration
spring.data.rest.base-path=/api/rest
spring.data.rest.default-page-size=20
spring.data.rest.max-page-size=100
spring.data.rest.return-body-on-create=true
spring.data.rest.return-body-on-update=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=./uploads/resumes

# JWT Security Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# AI Configuration (Gemini API with fallback)
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=gemini-1.5-flash
app.ai.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models

# Logging
logging.level.com.campusplacement=INFO
logging.level.org.springframework.web=INFO

